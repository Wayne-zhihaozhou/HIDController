name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build wheels and release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022]
        arch: [x86_64, ARM64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build cibuildwheel pybind11 setuptools

      - name: Build wheels
        run: |
          cibuildwheel --output-dir dist
        env:
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_ARCHS_WINDOWS: ${{ matrix.arch == 'ARM64' && 'ARM64' || 'AMD64' }}
          # 覆盖默认跳过 ARM64 的设置
          CIBW_SKIP: ${{ matrix.arch == 'ARM64' && '*-win32' || '*-win_arm64' }}

      - name: Build source distribution
        run: |
          python -m build --sdist

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-pypi:
    name: Publish to PyPI
    needs: [build-and-release]
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/hid-controller
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
