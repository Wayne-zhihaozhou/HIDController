[build-system]
requires = ["setuptools>=68.0", "cmake>=3.19", "ninja>=1.11"]
build-backend = "setuptools.build_meta"

[project]
name = "hid-controller"
version = "0.1.0"
description = "Mouse and keyboard control via Logitech HID reports"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hid_controller*"]
