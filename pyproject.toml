[build-system]
requires = ["setuptools>=64", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hid-controller"
version = "1.0.0"
description = "Mouse and keyboard control via Logitech HID reports"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "zhihao.zhou" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Wayne-zhihaozhou/DriverMouse"
Repository = "https://github.com/Wayne-zhihaozhou/DriverMouse"

[tool.setuptools]
zip-safe = false

[tool.cibuildwheel]
# 构建哪些平台
build = "cp311-win-amd64 cp312-win-amd64 cp313-win-amd64 cp311-linux_x86_64 cp312-linux_x86_64 cp313-linux_x86_64 cp311-macosx_x86_64 cp312-macosx_x86_64 cp313-macosx_x86_64 cp311-macosx_arm64 cp312-macosx_arm64 cp313-macosx_arm64"

# 跳过不支持的构建
skip = ["*-musllinux_*", "*-win32", "*-win_arm64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

# Python 代码规范配置
[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | vendor
    | wheels
)/
'''

[tool.flake8]
max-line-length = 120
max-complexity = 18
show-source = true
ignore = "E203,W503"
per-file-ignores = "__init__.py:F401"
count = true
statistics = true

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
